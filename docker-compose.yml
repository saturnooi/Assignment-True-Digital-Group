version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: rec_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recommendations
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d recommendations"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: rec_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: rec_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://user:password@postgres:5432/recommendations?sslmode=disable",
        "up"
      ]

  seed:
    build:
      context: .
      dockerfile: cmd/seed/Dockerfile
    container_name: rec_seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/recommendations?sslmode=disable
    command: ["./seed"]

  app:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    container_name: rec_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/recommendations?sslmode=disable
      REDIS_URL: redis:6379
    ports:
      - "8080:8080"

volumes:
  postgres_data: